name: Build Android Clock Widget APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Сборка установочного APK
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Установка и настройка Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Сборка отладочного APK
        run: |
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Загрузка готового APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Clock-Widget-Pixel9-GrapheneOS
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
